<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kansas Dash - كنساس داش</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kansasRed: '#dc2626',
                        kansasDark: '#121212',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-kansasDark text-white min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-black border-b border-gray-800 p-4 sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-red-500">كنساس داش | Kansas Dash</h1>
            <span class="text-xs bg-red-600 px-2 py-1 rounded text-white">متصل سحابياً</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto p-4 w-full flex-grow">
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 shadow-lg mb-4">
            <h2 class="text-lg font-semibold mb-2 text-gray-200">لوحة التحكم التشغيلية</h2>
            <p class="text-sm text-gray-400 mb-4">أهلاً بك يا طارق. النظام جاهز الآن للعمل والمزامنة المباشرة.</p>
            
            <div class="space-y-3">
                <div class="bg-gray-800 p-3 rounded-lg flex justify-between items-center">
                    <span>حالة النظام:</span>
                    <span class="text-green-400 font-bold">متصل بـ Firebase</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-black border-t border-gray-800 p-3 text-center text-xs text-gray-500">
        Kansas Dash Management System &copy; 2026
    </footer>

</body>
</html>
